# The daily check of the token a user account's workflows sign in with (noblefactor-engprod#613). It proves the classic
# token in ADD_TO_PROJECT_PAT, the secret the Triage workflow reads, and raises, repeats or clears this repository's
# incidents, assigned to the owner, with the run's own token. Landed as .github/workflows/credentials-check.yml, its
# script and configuration as .github/credentials-check/.
name: Credentials check
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/credentials-check
      - name: Check the token
        env:
          KIND: user
          ACCOUNT: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PAT: ${{ secrets.ADD_TO_PROJECT_PAT }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/credentials-check/credentials-check.sh
