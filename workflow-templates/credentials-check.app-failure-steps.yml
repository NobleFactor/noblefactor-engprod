# The steps a job that signs in with NobleFactor's GitHub App ends with (noblefactor-engprod#613). When the job fails,
# they check the App's token at once: a bad one raises its alert, naming the workflow and its run; one that checks fine
# raises nothing, the failure being the job's own. The check is fetched into a folder of its own, leaving the job's
# working tree as it is. The job's own token needs issues: write and contents: read.
      - uses: actions/checkout@v4
        if: failure()
        with:
          sparse-checkout: .github/credentials-check
          path: .credentials-check
      - name: Report a failure the App's token may have caused
        if: failure()
        env:
          CHECKS: app
          MODE: report
          KIND: organization
          ACCOUNT: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .credentials-check/.github/credentials-check/credentials-check.sh || true
