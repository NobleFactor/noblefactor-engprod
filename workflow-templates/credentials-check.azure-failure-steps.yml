# The steps a job that deploys a static site to Azure ends with (noblefactor-engprod#613). When the job fails, they
# check the site's Azure credentials at once: a bad one raises its alert, naming the workflow and its run; ones that
# check fine raise nothing, the failure being the job's own. The App's secrets are for setting a duplicate alert's
# Resolution. The check is fetched into a folder of its own, leaving the job's working tree as it is. The job's own
# token needs issues: write and contents: read.
      - uses: actions/checkout@v4
        if: failure()
        with:
          sparse-checkout: .github/credentials-check
          path: .credentials-check
      - name: Report a failure the Azure credentials may have caused
        if: failure()
        env:
          CHECKS: azure
          AZURE_STATIC_SITE: ${{ vars.AZURE_STATIC_SITE }}
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AZURE_CREDENTIALS_EXPIRES: ${{ vars.AZURE_CREDENTIALS_EXPIRES }}
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          MODE: report
          KIND: organization
          ACCOUNT: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          APP_ID: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.NOBLEFACTOR_AUTOMATION_APP_PRIVATE_KEY }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .credentials-check/.github/credentials-check/credentials-check.sh || true
