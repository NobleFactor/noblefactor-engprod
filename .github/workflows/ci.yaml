# SPDX-License-Identifier: Apache-2.0
name: CI

# This repository holds the organization's standards -- the PR script template, the Go style
# guidelines, the branch-protection policy, and the plan template CLAUDE.md mandates -- plus the
# base layer writ deploys. It builds nothing. The star records that sat beside them went to
# devlore-cli or were deleted in #228.
#
# The gate is therefore what a documents repository can actually assert: that the
# frontmatter is well formed against the standard this repository itself defines, that the prose is
# not misspelled, and -- since #161 put star extensions in Home/ -- that the Starlark is well formed.
# Since #268 the gates are the Makefile's targets: this workflow installs their tools and runs
# `make check`, which runs every gate and then the tests under tests/, so a local run and CI are one
# command. Each gate's reasons are written beside its target in the Makefile. Since #312 two jobs
# beside it run the tests on macOS and Windows, as make test runs them there.
#
# The job name must stay `quality-gate`. Organization ruleset 12426847 requires that context on every
# repository, so renaming it would leave a required check that never arrives -- which blocks every
# pull request rather than none.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    # ubuntu-26.04, not ubuntu-latest: Declare-BashScript requires bash 5.3 (#268), which the
    # ubuntu-26.04 image ships (5.3.9) and ubuntu-24.04, ubuntu-latest when this was written, does
    # not (5.2.21).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      # Each tool is pinned: a gate whose tool changes under CI fails on someone else's commit. shfmt
      # and buildifier are pinned to a release and its digest; upstream publishes no checksum file for
      # shfmt, so its digest was computed from the release asset on 2026-09-06. codespell is pinned to
      # a version through pipx. shellcheck comes from apt, as personal takes it, and so does tmux, for
      # Start-Claude's test (#312). No zsh: Ubuntu ships none, so Declare-BashScript's test runs its zsh
      # cases on the macOS job alone, and nothing here depends on Ubuntu's archive answering (#478).
      - name: Tools
        env:
          SHFMT_VERSION: v3.14.0
          SHFMT_SHA256: fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66
          BUILDIFIER_VERSION: v8.5.1
          BUILDIFIER_SHA256: 887377fc64d23a850f4d18a077b5db05b19913f4b99b270d193f3c7334b5a9a7
          CODESPELL_VERSION: 2.4.3
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y findutils jq shellcheck tmux
          curl -sSfL -o shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  shfmt" | sha256sum --check --strict
          curl -sSfL -o buildifier \
            "https://github.com/bazelbuild/buildtools/releases/download/${BUILDIFIER_VERSION}/buildifier-linux-amd64"
          echo "${BUILDIFIER_SHA256}  buildifier" | sha256sum --check --strict
          chmod +x shfmt buildifier
          mkdir -p "$HOME/.local/bin" && mv shfmt buildifier "$HOME/.local/bin/"
          pipx install "codespell==${CODESPELL_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # PowerShell's analyzer. The runner image ships pwsh, so only the module is installed, pinned
      # to a version like the tools above. The Gallery publishes no digest, so the pin is the version
      # alone.
      - name: PSScriptAnalyzer
        shell: pwsh
        env:
          PSSCRIPTANALYZER_VERSION: 1.25.0
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Scope CurrentUser -Force

      # star, for the extension's test, tests/Test-StarGitHub (#436): a pinned devlore release, as the tools above are
      # pinned, installed by devlore-cli's install.sh at that release's tag, which verifies the archive against the
      # release's checksums before it extracts anything. The release must carry devlore-cli#1215: before it, star wrote
      # an empty list as null, and the test's cases on the report's home and the sweep's lists fail.
      - name: star
        env:
          DEVLORE_VERSION: v0.1.0-dev.20261109005023
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/NobleFactor/devlore-cli/${DEVLORE_VERSION}/install.sh" | bash
          "$HOME/.local/bin/star" version --output value --silent

      - name: make check
        run: make check

  # The tests on macOS, as make test runs them there (#312), with what the owner's Mac puts first on PATH:
  # bash 5.3 and GNU getopt, which Declare-BashScript requires (#268, #290), GNU make, for .ONESHELL, and
  # the GNU coreutils, diffutils, findutils, grep, sed and awk the scripts are run with there; and tmux, for
  # Start-Claude's test. macOS ships bash 3.2, BSD getopt, make 3.81 and BSD tools, so Homebrew's go first
  # on PATH. Homebrew's formulas are not pinned: they are whatever it installs on the day. macOS 26, on
  # arm64, GitHub's newest (the owner, 2026-11-11, #480).
  test-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          set -euo pipefail
          brew install bash coreutils diffutils findutils gawk gnu-getopt gnu-sed grep jq make tmux
          prefix="$(brew --prefix)"
          {
            echo "${prefix}/bin"
            echo "${prefix}/opt/gnu-getopt/bin"
            for formula in coreutils findutils gawk gnu-sed grep make; do
              echo "${prefix}/opt/${formula}/libexec/gnubin"
            done
          } >> "$GITHUB_PATH"

      # star, for the extension's test, as the Linux job installs it: the same pinned release, by the same install.sh.
      - name: star
        env:
          DEVLORE_VERSION: v0.1.0-dev.20261109005023
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/NobleFactor/devlore-cli/${DEVLORE_VERSION}/install.sh" | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/star" version --output value --silent

      - name: make test
        run: make test

  # The PowerShell tests on Windows, as make test runs them there (#312). The runner has pwsh and git and
  # no psmux, for which Test-StartClaude.ps1 stands in a tmux that refuses every command. Two legs (the
  # owner, 2026-11-11, #480): Windows 11 on arm64, and on amd64 Windows Server 2025, since GitHub hosts
  # Windows 11 on arm64 alone; neither leg cancels the other when it fails.
  test-windows:
    name: test-windows (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: The PowerShell tests
        shell: pwsh
        run: ./bin/Test-Here.ps1
