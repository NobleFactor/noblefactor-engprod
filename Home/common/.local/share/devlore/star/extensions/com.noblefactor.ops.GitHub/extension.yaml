extension: com.noblefactor.ops.GitHub
description: GitHub under the NobleFactor issue data model -- every issue as a record, the triage sweep, the label set, and each account's model as GitHub holds it

commands:
  - name: github.schedule.report
    help: "Every issue, open and closed, of the repositories named, or of writ's layers, as one flat record each; narrow the result with --filter and --jq, render it with --output"
    implementation: commands/github-schedule-report.star
    args:
      - name: repositories
        help: "The repositories to read, owner/name; default: the repositories of writ's layers"
        variadic: true
    flags:
      - name: search
        type: string
        default: ""
        help: "Read only what GitHub's issue search finds, in its syntax, passed unchanged and run once for each repository as (<search>) repo:<repository> is:issue; an error when it matches more than 1,000 issues in one"

  - name: github.triage.sweep
    help: "Add every open issue that breaks a classification rule to its team's Triage project, commenting on it with the rules it breaks; return one flat record for each issue added, already there with a fault, or a Triage row; adds only, never removes; nothing is added under --dry-run"
    implementation: commands/github-triage-sweep.star
    args:
      - name: accounts
        help: "The accounts to sweep, NobleFactor or David-Noble-at-work; default: every account with a model"
        variadic: true

  - name: github.labels.audit
    help: Which repositories lack a kind, Epic:Ops:Process, or a thread label, and which carry one that has drifted
    implementation: commands/github-labels-audit.star
    flags:
      - name: repo
        type: string
        default: ""
        help: "Repositories to audit, owner/name, comma-separated; default: the repositories of writ's layers"
      - name: directory
        type: string
        default: ""
        help: A working tree; the audit targets the repository its origin names
      - name: markdown
        type: bool
        default: "false"
        help: Return the audit as a document, one string (render with -o value)

  - name: github.labels.sync
    help: Create the labels the audit reports missing and align the ones that drifted; never deletes; honors --dry-run
    implementation: commands/github-labels-sync.star
    flags:
      - name: repo
        type: string
        default: ""
        help: "Repositories to sync, owner/name, comma-separated; default: the repositories of writ's layers"
      - name: directory
        type: string
        default: ""
        help: A working tree; the sync targets the repository its origin names

  - name: github.model.get
    help: "An account's issue data model as GitHub holds it now: its issue types or type labels, its issue fields, its teams, its labels and its projects, as one record; -o yaml gives the form a backup keeps"
    implementation: commands/github-model-get.star
    args:
      - name: account
        help: "The account, an organization or a user; required"

  # The names before #378, kept so that what sessions run today still works; each runs the new command's code and
  # its help names the new command. A later task removes them once no skill, document or session names them. The
  # report's and the audit's went with #436, whose report takes none of the flags they declared, and whose audit
  # retired; the model's pull and digest went with #426.

  - name: gh.labels.audit
    help: "Renamed: star github labels audit. Which repositories lack a kind, Epic:Ops:Process, or a thread label, and which carry one that has drifted"
    implementation: commands/github-labels-audit.star
    flags:
      - name: repo
        type: string
        default: ""
        help: "Repositories to audit, owner/name, comma-separated; default: the repositories of writ's layers"
      - name: directory
        type: string
        default: ""
        help: A working tree; the audit targets the repository its origin names
      - name: markdown
        type: bool
        default: "false"
        help: Return the audit as a document, one string (render with -o value)

  - name: gh.labels.sync
    help: "Renamed: star github labels sync. Create the labels the audit reports missing and align the ones that drifted; never deletes; honors --dry-run"
    implementation: commands/github-labels-sync.star
    flags:
      - name: repo
        type: string
        default: ""
        help: "Repositories to sync, owner/name, comma-separated; default: the repositories of writ's layers"
      - name: directory
        type: string
        default: ""
        help: A working tree; the sync targets the repository its origin names

config:
  path: github
  type: GitHubConfig
  fields:
    account: "string"
  defaults:
    account: "NobleFactor"
