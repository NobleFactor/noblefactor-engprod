extension: com.noblefactor.ops.GitHub
description: GitHub under the NobleFactor issue data model -- every issue as a record, the triage sweep, the label set, and the model's pull

commands:
  - name: github.schedule.report
    help: "Every issue, open and closed, of the repositories named, or of writ's layers, as one flat record each; narrow the result with --filter and --jq, render it with --output"
    implementation: commands/github-schedule-report.star
    args:
      - name: repositories
        help: "The repositories to read, owner/name; default: the repositories of writ's layers"
        variadic: true
    flags:
      - name: search
        type: string
        default: ""
        help: "Read only what GitHub's issue search finds, in its syntax, passed unchanged and run once for each repository as (<search>) repo:<repository> is:issue; an error when it matches more than 1,000 issues in one"

  - name: github.triage.sweep
    help: "Add every open issue that breaks a classification rule to its team's Triage project, commenting on it with the rules it breaks; return one flat record for each issue added, already there with a fault, or a Triage row; adds only, never removes; nothing is added under --dry-run"
    implementation: commands/github-triage-sweep.star
    args:
      - name: accounts
        help: "The accounts to sweep, NobleFactor or David-Noble-at-work; default: every account with a model"
        variadic: true

  - name: github.labels.audit
    help: Which repositories lack a kind, Epic:Ops:Process, or a thread label, and which carry one that has drifted
    implementation: commands/github-labels-audit.star
    flags:
      - name: repo
        type: string
        default: ""
        help: "Repositories to audit, owner/name, comma-separated; default: the repositories of writ's layers"
      - name: directory
        type: string
        default: ""
        help: A working tree; the audit targets the repository its origin names
      - name: markdown
        type: bool
        default: "false"
        help: Return the audit as a document, one string (render with -o value)

  - name: github.labels.sync
    help: Create the labels the audit reports missing and align the ones that drifted; never deletes; honors --dry-run
    implementation: commands/github-labels-sync.star
    flags:
      - name: repo
        type: string
        default: ""
        help: "Repositories to sync, owner/name, comma-separated; default: the repositories of writ's layers"
      - name: directory
        type: string
        default: ""
        help: A working tree; the sync targets the repository its origin names

  - name: github.model.pull
    help: "Pull an account's issue types, issue fields, teams, labels and projects into its model file, read by ETag where GitHub offers one, and print the diff; --check previews"
    implementation: commands/github-model-pull.star
    flags:
      - name: account
        type: string
        default: ""
        help: "The account whose model is pulled, an organization or a user; default: star configuration's github.account, and then NobleFactor"
      - name: asset
        type: string
        default: ""
        help: "The model file to write, which a real pull writes only on a branch; default: model.<account>.yaml beside this extension. The default account's model is <account>/.github/model.yaml, so name a clone's; without one, --check compares GitHub with star's copy of it"
      - name: check
        type: bool
        default: "false"
        help: "Print what would change and write nothing. A workaround for NobleFactor/devlore-cli#1170: star's --dry-run skips the reads a preview needs, so this command refuses it"

  - name: github.model.digest
    help: Re-sign a deliberately hand-edited model.yaml, its digest over the file with its own line excluded; --check previews
    implementation: commands/github-model-digest.star
    flags:
      - name: asset
        type: string
        default: ""
        help: "The model file to re-sign. The default account's model is <account>/.github/model.yaml, so name a clone's; there is no default"
      - name: check
        type: bool
        default: "false"
        help: "Print what would change and write nothing. A workaround for NobleFactor/devlore-cli#1170: star's --dry-run skips the reads a preview needs, so this command refuses it"

  # The names before #378, kept so that what sessions run today still works; each runs the new command's code and
  # its help names the new command. A later task removes them once no skill, document or session names them. The
  # report's and the audit's went with #436, whose report takes none of the flags they declared, and whose audit
  # retired.

  - name: gh.labels.audit
    help: "Renamed: star github labels audit. Which repositories lack a kind, Epic:Ops:Process, or a thread label, and which carry one that has drifted"
    implementation: commands/github-labels-audit.star
    flags:
      - name: repo
        type: string
        default: ""
        help: "Repositories to audit, owner/name, comma-separated; default: the repositories of writ's layers"
      - name: directory
        type: string
        default: ""
        help: A working tree; the audit targets the repository its origin names
      - name: markdown
        type: bool
        default: "false"
        help: Return the audit as a document, one string (render with -o value)

  - name: gh.labels.sync
    help: "Renamed: star github labels sync. Create the labels the audit reports missing and align the ones that drifted; never deletes; honors --dry-run"
    implementation: commands/github-labels-sync.star
    flags:
      - name: repo
        type: string
        default: ""
        help: "Repositories to sync, owner/name, comma-separated; default: the repositories of writ's layers"
      - name: directory
        type: string
        default: ""
        help: A working tree; the sync targets the repository its origin names

  - name: gh.model.pull
    help: "Renamed: star github model pull. Pull an account's issue types, issue fields, teams, labels and projects into its model file, and print the diff; --check previews"
    implementation: commands/github-model-pull.star
    flags:
      - name: account
        type: string
        default: ""
        help: "The account whose model is pulled, an organization or a user; default: star configuration's github.account, and then NobleFactor"
      - name: asset
        type: string
        default: ""
        help: "The model file to write, which a real pull writes only on a branch; default: model.<account>.yaml beside this extension. The default account's model is <account>/.github/model.yaml, so name a clone's; without one, --check compares GitHub with star's copy of it"
      - name: check
        type: bool
        default: "false"
        help: "Print what would change and write nothing. A workaround for NobleFactor/devlore-cli#1170: star's --dry-run skips the reads a preview needs, so this command refuses it"

  - name: gh.model.digest
    help: "Renamed: star github model digest. Re-sign a deliberately hand-edited model.yaml, its digest over the file with its own line excluded; --check previews"
    implementation: commands/github-model-digest.star
    flags:
      - name: asset
        type: string
        default: ""
        help: "The model file to re-sign. The default account's model is <account>/.github/model.yaml, so name a clone's; there is no default"
      - name: check
        type: bool
        default: "false"
        help: "Print what would change and write nothing. A workaround for NobleFactor/devlore-cli#1170: star's --dry-run skips the reads a preview needs, so this command refuses it"

config:
  path: github
  type: GitHubConfig
  fields:
    account: "string"
  defaults:
    account: "NobleFactor"
