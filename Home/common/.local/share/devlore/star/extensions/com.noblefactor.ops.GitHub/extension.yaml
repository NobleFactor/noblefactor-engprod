extension: com.noblefactor.ops.GitHub
description: GitHub under the NobleFactor issue data model -- every issue as a record, the triage sweep, and each account's model as GitHub holds it

commands:
  - name: github.schedule.report
    help: "Every issue, open and closed, of the repositories named, or of writ's layers, as one flat record each; narrow the result with --filter and --jq, render it with --output"
    implementation: commands/github-schedule-report.star
    args:
      - name: repositories
        help: "The repositories to read, owner/name; default: the repositories of writ's layers"
        variadic: true
    flags:
      - name: search
        type: string
        default: ""
        help: "Read only what GitHub's issue search finds, in its syntax, passed unchanged and run once for each repository as (<search>) repo:<repository> is:issue; an error when it matches more than 1,000 issues in one"

  - name: github.triage.sweep
    help: "Add every open issue that breaks a classification rule to its team's Triage project, commenting on it with the rules it breaks; return one flat record for each issue added, already there with a fault, or a Triage row; adds only, never removes; refuses --dry-run until NobleFactor/devlore-cli#1170 lets a dry run read"
    implementation: commands/github-triage-sweep.star
    args:
      - name: accounts
        help: "The accounts to sweep, NobleFactor or David-Noble-at-work; default: star's default account and the owner of each of writ's layer repositories"
        variadic: true

  - name: github.model.get
    help: "An account's issue data model as GitHub holds it now: its issue types or type labels, its issue fields, its teams, its labels, and its project templates with their fields and views, as one record; -o yaml gives the form a backup keeps"
    implementation: commands/github-model-get.star
    args:
      - name: account
        help: "The account, an organization or a user; required"

  - name: github.model.diff
    help: "What differs between a model and an account's, as GitHub holds it now: one record for each difference; writes nothing"
    implementation: commands/github-model-diff.star
    args:
      - name: model
        help: "The model: a file in the form get returns, another account's, a backup, or a reference, by its path"
      - name: account
        help: "The account, an organization or a user; required"

  - name: github.model.apply
    help: "Make a model the account's: every difference diff finds made in GitHub, renames in place, nothing deleted without --prune; one record for each difference, with what was done"
    implementation: commands/github-model-apply.star
    args:
      - name: model
        help: "The model: a file in the form get returns, another account's, a backup, or a reference, by its path"
      - name: account
        help: "The account, an organization or a user; required"
    flags:
      - name: prune
        type: bool
        default: "false"
        help: "Delete what the model lacks too, each deletion first counted; never a team, its roles, a project or a template"
      - name: token
        type: string
        default: ""
        help: "Where each secret the Triage workflow signs in with comes from: <SECRET>=env:<NAME> or <SECRET>=file:<path>, comma-separated, or a bare env:<NAME> or file:<path> when the workflow uses one; never a secret's value"

  - name: github.model.restore
    help: "Apply an account's backup to it: model.yaml from its .github repository, at the revision named or main, applied as apply applies a model"
    implementation: commands/github-model-restore.star
    args:
      - name: account
        help: "The account, an organization or a user; required"
      - name: revision
        default: "main"
        help: "The backup's revision in the account's .github repository: a commit, a tag or a branch; main when none is named"
    flags:
      - name: prune
        type: bool
        default: "false"
        help: "Delete what the backup lacks too, each deletion first counted; never a team, its roles, a project or a template"
      - name: token
        type: string
        default: ""
        help: "Where each secret the Triage workflow signs in with comes from, as apply takes it; never a secret's value"

  - name: github.model.backup
    help: "Checkpoint an account's model, as GitHub holds it now, in its .github repository: written on a chore/model-<date> branch and landed by a pull request, asking nothing yet"
    implementation: commands/github-model-backup.star
    args:
      - name: account
        help: "The account, an organization or a user; required"

config:
  path: github
  type: GitHubConfig
  fields:
    account: "string"
  defaults:
    account: "NobleFactor"
