extension: com.noblefactor.ops.GitHub
description: GitHub under the NobleFactor issue data model -- every issue as a record, the triage sweep, and each account's model as GitHub holds it

commands:
  - name: github.schedule.report
    help: "List every issue, open and closed, of the repositories named, or of writ's layers, one record each, with where it lives"
    implementation: commands/github-schedule-report.star
    args:
      - name: repositories
        help: "The repositories to read, owner/name; default: the repositories of writ's layers"
        variadic: true
    flags:
      - name: search
        type: string
        default: ""
        help: "Only the issues GitHub's issue search finds, in its syntax, run once per repository; an error past 1,000 in one"

  - name: github.schedule.list
    help: "List an account's schedules, or one team's, each with its Schedule issue and its open and closed steps"
    implementation: commands/github-schedule-list.star
    args:
      - name: account
        help: "The account, an organization or a user; required"
    flags:
      - name: team
        type: string
        default: ""
        help: "The team whose Schedule project alone is read, by its slug; refused in a user account, which has no teams"

  - name: github.schedule.get
    help: "List a schedule's rows, its Schedule issue first, then its steps in order, with each one's state and blockers"
    implementation: commands/github-schedule-get.star
    args:
      - name: schedule
        help: "The schedule's own issue, <owner>/<repository>#<number>, as a session's NFEP_AGENT_SCHEDULE names it; required"

  - name: github.schedule.open
    help: "Open a schedule: its Schedule issue, from the account's Schedule form, its option and its own row"
    implementation: commands/github-schedule-open.star
    args:
      - name: repository
        help: "The repository the Schedule issue is filed in, <owner>/<name>, whose team, or user account, owns the schedule; required"
      - name: name
        help: "The schedule's name: its option, and its issue's title after Schedule: ; required"
    flags:
      - name: area
        type: string
        default: ""
        help: "Product or Engineering: the Schedule issue's Area; required"
      - name: deliverable
        type: string
        default: ""
        help: "What the schedule delivers: the form's Deliverable section; required"
      - name: exit-criteria
        type: string
        default: ""
        help: "How we'll know it's finished: the form's Exit criteria section; required"
      - name: evidence
        type: string
        default: ""
        help: "What a comment on the issue will show before it closes: the form's Evidence of completion section; required"
      - name: priority
        type: string
        default: ""
        help: "The Schedule issue's Priority, one of its account's Priority options; default: Medium"
      - name: assignee
        type: string
        default: ""
        help: "Who owns the schedule, assigned its issue; default: you, who run the command"

  - name: github.schedule.create
    help: "Open a schedule, as schedule open does: create is another name for open"
    implementation: commands/github-schedule-open.star
    args:
      - name: repository
        help: "The repository the Schedule issue is filed in, <owner>/<name>, whose team, or user account, owns the schedule; required"
      - name: name
        help: "The schedule's name: its option, and its issue's title after Schedule: ; required"
    flags:
      - name: area
        type: string
        default: ""
        help: "Product or Engineering: the Schedule issue's Area; required"
      - name: deliverable
        type: string
        default: ""
        help: "What the schedule delivers: the form's Deliverable section; required"
      - name: exit-criteria
        type: string
        default: ""
        help: "How we'll know it's finished: the form's Exit criteria section; required"
      - name: evidence
        type: string
        default: ""
        help: "What a comment on the issue will show before it closes: the form's Evidence of completion section; required"
      - name: priority
        type: string
        default: ""
        help: "The Schedule issue's Priority, one of its account's Priority options; default: Medium"
      - name: assignee
        type: string
        default: ""
        help: "Who owns the schedule, assigned its issue; default: you, who run the command"

  - name: github.schedule.close
    help: "Close a finished schedule, posting its evidence: what each merged pull request closed, and how the rest closed"
    implementation: commands/github-schedule-close.star
    args:
      - name: schedule
        help: "The schedule's own issue, <owner>/<repository>#<number>, as a session's NFEP_AGENT_SCHEDULE names it; required"

  - name: github.schedule.reopen
    help: "Reopen a closed schedule: its issue, a comment saying why, its own row In progress, its every-step box unticked"
    implementation: commands/github-schedule-reopen.star
    args:
      - name: schedule
        help: "The schedule's own issue, <owner>/<repository>#<number>, as a session's NFEP_AGENT_SCHEDULE names it; required"
    flags:
      - name: reason
        type: string
        default: ""
        help: "Why the schedule is reopened, written in the comment on its Schedule issue; required"

  - name: github.scenario.list
    help: "List an account's scenarios, or one team's, each with its Scenario issue and its open and closed items"
    implementation: commands/github-scenario-list.star
    args:
      - name: account
        help: "The account, an organization or a user; required"
    flags:
      - name: team
        type: string
        default: ""
        help: "The team whose Scenario project alone is read, by its slug; refused in a user account, which has no teams"

  - name: github.scenario.get
    help: "List a scenario's rows, its Scenario issue first, then its items in Beat order, with each one's state"
    implementation: commands/github-scenario-get.star
    args:
      - name: scenario
        help: "The scenario's own issue, <owner>/<repository>#<number>; required"

  - name: github.scenario.open
    help: "Open a scenario: its Scenario issue, from the account's Scenario form, its option and its own row"
    implementation: commands/github-scenario-open.star
    args:
      - name: repository
        help: "The repository the Scenario issue is filed in, <owner>/<name>, whose team, or user account, owns the scenario; required"
      - name: name
        help: "The scenario's name: its option, and its issue's title after Scenario: ; required"
    flags:
      - name: area
        type: string
        default: ""
        help: "Product or Engineering: the Scenario issue's Area; required"
      - name: wants
        type: string
        default: ""
        help: "What the person wants to do, said the way they would: the form's What the person wants to do section; required"
      - name: walk
        type: string
        default: ""
        help: "How to walk through it, a numbered list whose step N is Beat N: the form's How to walk through it; required"
      - name: features
        type: string
        default: ""
        help: "The features it uses, each by its issue: the form's The features it uses section; required"
      - name: priority
        type: string
        default: ""
        help: "The Scenario issue's Priority, one of its account's Priority options; default: Medium"
      - name: assignee
        type: string
        default: ""
        help: "Who owns the scenario, assigned its issue; default: you, who run the command"

  - name: github.scenario.create
    help: "Open a scenario, as scenario open does: create is another name for open"
    implementation: commands/github-scenario-open.star
    args:
      - name: repository
        help: "The repository the Scenario issue is filed in, <owner>/<name>, whose team, or user account, owns the scenario; required"
      - name: name
        help: "The scenario's name: its option, and its issue's title after Scenario: ; required"
    flags:
      - name: area
        type: string
        default: ""
        help: "Product or Engineering: the Scenario issue's Area; required"
      - name: wants
        type: string
        default: ""
        help: "What the person wants to do, said the way they would: the form's What the person wants to do section; required"
      - name: walk
        type: string
        default: ""
        help: "How to walk through it, a numbered list whose step N is Beat N: the form's How to walk through it; required"
      - name: features
        type: string
        default: ""
        help: "The features it uses, each by its issue: the form's The features it uses section; required"
      - name: priority
        type: string
        default: ""
        help: "The Scenario issue's Priority, one of its account's Priority options; default: Medium"
      - name: assignee
        type: string
        default: ""
        help: "Who owns the scenario, assigned its issue; default: you, who run the command"

  - name: github.scenario.close
    help: "Close a scenario the product no longer has, once every item has moved on, with a comment saying why"
    implementation: commands/github-scenario-close.star
    args:
      - name: scenario
        help: "The scenario's own issue, <owner>/<repository>#<number>; required"
    flags:
      - name: reason
        type: string
        default: ""
        help: "Why the product no longer has the scenario, written in the comment on its Scenario issue; required"

  - name: github.scenario.reopen
    help: "Reopen a closed scenario: its issue, a comment saying why, and its own row Open"
    implementation: commands/github-scenario-reopen.star
    args:
      - name: scenario
        help: "The scenario's own issue, <owner>/<repository>#<number>; required"
    flags:
      - name: reason
        type: string
        default: ""
        help: "Why the scenario is reopened, written in the comment on its Scenario issue; required"

  - name: github.issue.open
    help: "Open an issue in this clone's repository, from flags or a template, its type, parent, Area and Priority set"
    implementation: commands/github-issue-open.star
    flags:
      - name: template
        type: string
        default: ""
        help: "A template file: a header between two --- lines with the flags' values, then the body; --set fills its {name} blanks"
      - name: set
        type: string
        default: ""
        help: "With --template, the values of its blanks, <name>=<value>, comma-separated; a blank left unfilled is refused"
      - name: type
        type: string
        default: ""
        help: "The issue's type: Epic, Feature, Task or Bug; a Schedule or Scenario issue is opened by its group's open"
      - name: parent
        type: string
        default: ""
        help: "Its parent, <owner>/<repository>#<number>, one level up; an Epic has none, and every other type needs one"
      - name: title
        type: string
        default: ""
        help: "Its title"
      - name: body-file
        type: string
        default: ""
        help: "A file holding its body, every section its type's form requires and its Plan and design documents table"
      - name: area
        type: string
        default: ""
        help: "Its Area, Product or Engineering; required"
      - name: priority
        type: string
        default: ""
        help: "Its Priority, Urgent, High, Medium or Low; default: Medium"
      - name: severity
        type: string
        default: ""
        help: "A Bug's Severity, Critical, High, Medium or Low; default: Medium; every other type's is N/A"
      - name: assignee
        type: string
        default: ""
        help: "Who it is assigned to; default: no one"
      - name: directory
        type: string
        default: ""
        help: "The clone whose repository the issue opens in, as git's -C names one; default: the clone the command runs in"

  - name: github.issue.create
    help: "Open an issue, as issue open does: create is another name for open"
    implementation: commands/github-issue-open.star
    flags:
      - name: template
        type: string
        default: ""
        help: "A template file: a header between two --- lines with the flags' values, then the body; --set fills its {name} blanks"
      - name: set
        type: string
        default: ""
        help: "With --template, the values of its blanks, <name>=<value>, comma-separated; a blank left unfilled is refused"
      - name: type
        type: string
        default: ""
        help: "The issue's type: Epic, Feature, Task or Bug; a Schedule or Scenario issue is opened by its group's open"
      - name: parent
        type: string
        default: ""
        help: "Its parent, <owner>/<repository>#<number>, one level up; an Epic has none, and every other type needs one"
      - name: title
        type: string
        default: ""
        help: "Its title"
      - name: body-file
        type: string
        default: ""
        help: "A file holding its body, every section its type's form requires and its Plan and design documents table"
      - name: area
        type: string
        default: ""
        help: "Its Area, Product or Engineering; required"
      - name: priority
        type: string
        default: ""
        help: "Its Priority, Urgent, High, Medium or Low; default: Medium"
      - name: severity
        type: string
        default: ""
        help: "A Bug's Severity, Critical, High, Medium or Low; default: Medium; every other type's is N/A"
      - name: assignee
        type: string
        default: ""
        help: "Who it is assigned to; default: no one"
      - name: directory
        type: string
        default: ""
        help: "The clone whose repository the issue opens in, as git's -C names one; default: the clone the command runs in"

  - name: github.issue.move
    help: "Move issues to Triage, the Backlog, a schedule or a scenario, from wherever they are, recording each move"
    implementation: commands/github-issue-move.star
    args:
      - name: issues
        help: "The issues to move, <owner>/<repository>#<number>, in the order they go"
        variadic: true
    flags:
      - name: schedule
        type: string
        default: ""
        help: "The schedule to put them on or move them within: its Schedule issue, <owner>/<repository>#<number>"
      - name: after
        type: string
        default: ""
        help: "With --schedule, the step to put them after, later steps moving down; 0 puts them first; default: after the last"
      - name: blocked-by
        type: string
        default: ""
        help: "With --schedule, the issues each is blocked by, <owner>/<repository>#<number>, comma-separated"
      - name: assignee
        type: string
        default: ""
        help: "With --schedule, a member of the schedule's team who answers for an issue from another team's repository"
      - name: scenario
        type: string
        default: ""
        help: "The scenario to put them on, or whose Beat to set: its own issue, <owner>/<repository>#<number>"
      - name: beat
        type: string
        default: ""
        help: "With --scenario, the step of the walk at which they turned up: 0 before its first, and no later than its last"
      - name: triage
        type: bool
        default: "false"
        help: "Put them in their team's Triage project, from wherever they are: a schedule, a scenario, the Backlog or no project"
      - name: backlog
        type: bool
        default: "false"
        help: "Put them on their team's Backlog from wherever they are, keeping their Priority; an issue with no type is refused"
      - name: reason
        type: string
        default: ""
        help: "Why they move, written in the Schedule issue's amendment or the comment on the Scenario issue; required"

  - name: github.issue.close
    help: "Close issues as completed, each with its evidence or the reason its work wasn't done, and update their rows"
    implementation: commands/github-issue-close.star
    args:
      - name: issues
        help: "The issues to close, <owner>/<repository>#<number>, in the order given"
        variadic: true
    flags:
      - name: evidence
        type: string
        default: ""
        help: "For work done: a file whose text is each issue's evidence comment, headed ## Evidence: <title> when it has no heading"
      - name: resolution
        type: string
        default: ""
        help: "For work not done: Declined, Duplicate or Invalid, set as the Resolution field or a resolution: label; needs --reason"
      - name: reason
        type: string
        default: ""
        help: "With --resolution, why the work was not done, written in the comment on each issue"

  - name: github.issue.reopen
    help: "Reopen issues, and the closed parents and schedules they belong to, clearing each Resolution and saying why"
    implementation: commands/github-issue-reopen.star
    args:
      - name: issues
        help: "The issues to reopen, <owner>/<repository>#<number>, in the order given"
        variadic: true
    flags:
      - name: reason
        type: string
        default: ""
        help: "Why they are reopened, written in the comment on each issue, parent and schedule reopened; required"

  - name: github.plan.link
    help: "Write each issue's Plan and design documents table from the plans that serve it; --check writes nothing"
    implementation: commands/github-plan-link.star
    args:
      - name: plans
        help: "The plans, each its path relative to docs/plans in the clone or worktree the command runs in, read from its working tree"
        variadic: true
    flags:
      - name: all
        type: bool
        default: "false"
        help: "Every issue a plan under docs/plans on each repository's default branch serves, in place of plans named"
      - name: repository
        type: string
        default: ""
        help: "The repositories whose default branches' plans are read too, owner/name, comma-separated; default: writ's layers"
      - name: check
        type: bool
        default: "false"
        help: "Write nothing: return the records the command would, so that every issue's section can be checked against its plans"

  - name: github.triage.sweep
    help: "Add each open issue that breaks a classification rule to its team's Triage project, commenting which rules"
    implementation: commands/github-triage-sweep.star
    args:
      - name: accounts
        help: "The accounts to sweep; default: star's default account and the owner of each of writ's layer repositories"
        variadic: true

  - name: github.model.get
    help: "Print an account's issue model as GitHub holds it: types, fields, teams, labels and project templates"
    implementation: commands/github-model-get.star
    args:
      - name: account
        help: "The account, an organization or a user; required"

  - name: github.model.diff
    help: "List what differs between a model and an account as GitHub holds it, one record each; writes nothing"
    implementation: commands/github-model-diff.star
    args:
      - name: model
        help: "The model: a file in the form get returns, another account's, a backup, or a reference, by its path"
      - name: account
        help: "The account, an organization or a user; required"

  - name: github.model.apply
    help: "Make a model the account's, writing each difference diff finds; deletes nothing of the account's without --prune"
    implementation: commands/github-model-apply.star
    args:
      - name: model
        help: "The model: a file in the form get returns, another account's, a backup, or a reference, by its path"
      - name: account
        help: "The account, an organization or a user; required"
    flags:
      - name: prune
        type: bool
        default: "false"
        help: "Delete what the model lacks too, each deletion first counted; never a team, its roles, a project or a template"
      - name: token
        type: string
        default: ""
        help: "Each Triage workflow secret's source, <SECRET>=env:<NAME> or <SECRET>=file:<path>, comma-separated, or bare for one"

  - name: github.model.restore
    help: "Apply an account's backup, model.yaml in its .github repository at main or the revision named, as apply does"
    implementation: commands/github-model-restore.star
    args:
      - name: account
        help: "The account, an organization or a user; required"
      - name: revision
        default: "main"
        help: "The backup's revision in the account's .github repository: a commit, a tag or a branch; main when none is named"
    flags:
      - name: prune
        type: bool
        default: "false"
        help: "Delete what the backup lacks too, each deletion first counted; never a team, its roles, a project or a template"
      - name: token
        type: string
        default: ""
        help: "Where each secret the Triage workflow signs in with comes from, as apply takes it; never a secret's value"

  - name: github.model.backup
    help: "Save an account's model in its .github repository, by a pull request from a doc/model-<date> branch"
    implementation: commands/github-model-backup.star
    args:
      - name: account
        help: "The account, an organization or a user; required"

config:
  path: github
  type: GitHubConfig
  fields:
    account: "string"
  defaults:
    account: "NobleFactor"
